name: Build Caddy Stats Custom Image

on:
  push:
    branches: ['main']
    paths:
      - 'caddy-stats/**'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/lukino2000/caddy-stats
      DOCKER_METADATA_SHORT_SHA_LENGTH: 12
    permissions:
      packages: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve upstream caddy-stats SHA
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          FULL_SHA="$(git ls-remote https://github.com/Lukino2000/caddy-stats.git HEAD | awk '{print $1}')"
          SHORT_SHA="${FULL_SHA:0:12}"
          echo "full_sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Resolve current repo SHA
        id: current
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check existing image tags
        id: image_check
        shell: bash
        run: |
          set -euo pipefail
          REPO_TAG="sha-${{ steps.current.outputs.short_sha }}"
          UPSTREAM_TAG="upstream-${{ steps.upstream.outputs.short_sha }}"

          REPO_EXISTS=false
          UPSTREAM_EXISTS=false

          if docker manifest inspect "${IMAGE_NAME}:${REPO_TAG}" >/dev/null 2>&1; then
            REPO_EXISTS=true
          fi

          if docker manifest inspect "${IMAGE_NAME}:${UPSTREAM_TAG}" >/dev/null 2>&1; then
            UPSTREAM_EXISTS=true
          fi

          if [ "${REPO_EXISTS}" = "true" ] && [ "${UPSTREAM_EXISTS}" = "true" ]; then
            SHOULD_BUILD=false
            echo "Image already published for ${REPO_TAG} and ${UPSTREAM_TAG}; skipping build."
          else
            SHOULD_BUILD=true
            echo "Missing image tag(s): repo=${REPO_EXISTS}, upstream=${UPSTREAM_EXISTS}; build will run."
          fi

          echo "repo_exists=${REPO_EXISTS}" >> "$GITHUB_OUTPUT"
          echo "upstream_exists=${UPSTREAM_EXISTS}" >> "$GITHUB_OUTPUT"
          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
            type=raw,value=upstream-${{ steps.upstream.outputs.short_sha }}

      - name: Build and Push
        if: steps.image_check.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./caddy-stats
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REPO_REF=${{ steps.upstream.outputs.full_sha }}